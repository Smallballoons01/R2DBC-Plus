# R2DBC Plus MySQL 测试环境配置

spring:
  # R2DBC 数据源配置
  r2dbc:
    url: r2dbc:mysql://${R2DBC_TEST_HOST}:${R2DBC_TEST_PORT}/${R2DBC_TEST_DB}
    username: test
    password: <REDACTED_PASSWORD>
    pool:
      # 连接池配置
      enabled: true
      initial-size: 1
      max-size: 50
      max-idle-time: 30m
      max-life-time: 60m
      max-acquire-time: 30s
      max-create-connection-time: 30s
      validation-query: SELECT 1

# 日志配置
logging:
  level:
    com.scrm.r2dbc.plus: DEBUG
    io.asyncer.r2dbc.mysql: DEBUG
    org.springframework.boot.test: INFO
    org.junit: INFO

